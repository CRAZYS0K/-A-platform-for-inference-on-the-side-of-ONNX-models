spring:
  application:
    name: gateway-service
  thymeleaf:
    cache: false

  servlet:
    multipart:
      enabled: true
      max-file-size: 500MB
      max-request-size: 600MB
      file-size-threshold: 10MB
    session:
      cookie:
        http-only: true
        secure: ${COOKIE_SECURE:false}
        same-site: lax

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  session:
    store-type: redis
    timeout: 30m
    redis:
      namespace: spring:session:onnxi

  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: ${KEYCLOAK_CLIENT_ID:onnxi-gateway}
            client-secret: ${KEYCLOAK_CLIENT_SECRET:change-me-gateway-secret}
            authorization-grant-type: authorization_code
            scope: openid, profile, email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          keycloak:
            authorization-uri: ${KEYCLOAK_AUTH_URI:http://localhost/auth/realms/onnxi/protocol/openid-connect/auth}
            token-uri: ${KEYCLOAK_TOKEN_URI:http://localhost/auth/realms/onnxi/protocol/openid-connect/token}
            user-info-uri: ${KEYCLOAK_USERINFO_URI:http://localhost/auth/realms/onnxi/protocol/openid-connect/userinfo}
            jwk-set-uri: ${KEYCLOAK_JWKS_URI:http://localhost/auth/realms/onnxi/protocol/openid-connect/certs}
            user-name-attribute: preferred_username

server:
  port: 8080
  forward-headers-strategy: framework

rate-limit:
  enabled: ${RATE_LIMIT_ENABLED:true}
  capacity: ${RATE_LIMIT_CAPACITY:60}
  refill-tokens: ${RATE_LIMIT_REFILL:60}
  refill-period: ${RATE_LIMIT_PERIOD:PT1M}

backend:
  base-url: ${BACKEND_BASE_URL:http://backend-service:8081}

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  level:
    root: INFO
    com.sokolov.labs: DEBUG
