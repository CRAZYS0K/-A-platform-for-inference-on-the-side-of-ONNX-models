<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <title th:text="${title} + ' · ONNXI'">ONNXI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg bg-dark navbar-dark">
    <div class="container">
        <a class="navbar-brand" href="/">ONNXI</a>
        <ul class="navbar-nav me-auto">
            <li class="nav-item"><a class="nav-link" href="/models">Модели</a></li>
            <li class="nav-item"><a class="nav-link" href="/datasets">Датасеты</a></li>
            <li class="nav-item"><a class="nav-link" href="/tasks">Задачи</a></li>
            <li class="nav-item"><a class="nav-link" href="/notifications">Уведомления</a></li>
            <li class="nav-item"><a class="nav-link" href="/profile">Профиль</a></li>
        </ul>
        <div>
            <a sec:authorize="!isAuthenticated()" class="btn btn-outline-light" href="/oauth2/authorization/keycloak">Войти</a>
            <span sec:authorize="isAuthenticated()" class="text-light me-2" sec:authentication="name">user</span>
            <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post" class="d-inline">
                <button class="btn btn-outline-light" type="submit">Выйти</button>
            </form>
        </div>
    </div>
</nav>

<div th:fragment="flash" class="container mt-3">
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
</div>
</body>
</html>
