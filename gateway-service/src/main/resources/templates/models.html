<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Модели')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: flash}"></div>

<main class="container py-4">
    <h1>Модели</h1>

    <form class="card card-body mb-4" method="post" enctype="multipart/form-data" th:action="@{/models}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <div class="row g-2 align-items-end">
            <div class="col-md-4">
                <label class="form-label">Название</label>
                <input name="name" type="text" required class="form-control" placeholder="MNIST-8">
            </div>
            <div class="col-md-6">
                <label class="form-label">Файл .onnx</label>
                <input name="file" type="file" accept=".onnx" required class="form-control">
            </div>
            <div class="col-md-2 d-grid">
                <button type="submit" class="btn btn-primary">Загрузить</button>
            </div>
        </div>
    </form>

    <table class="table table-hover">
        <thead>
        <tr>
            <th>Название</th>
            <th>Размер</th>
            <th>Вход</th>
            <th>Выход</th>
            <th>Загружено</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="m : ${models}">
            <td th:text="${m.name}">name</td>
            <td th:text="${#numbers.formatDecimal(m.sizeBytes / 1024.0, 0, 0)} + ' КБ'">size</td>
            <td th:text="${m.inputShape}">shape</td>
            <td th:text="${m.outputShape}">shape</td>
            <td th:text="${#temporals.format(m.uploadedAt, 'yyyy-MM-dd HH:mm')}">date</td>
            <td>
                <form method="post" th:action="@{|/models/${m.id}/delete|}" class="d-inline">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button class="btn btn-sm btn-outline-danger" type="submit"
                            onclick="return confirm('Удалить модель?')">Удалить</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(models)}">
            <td colspan="6" class="text-muted text-center">Пока нет загруженных моделей</td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
