<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ONNXI · Профиль</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg bg-dark navbar-dark">
    <div class="container">
        <a class="navbar-brand" href="/">ONNXI</a>
        <form th:action="@{/logout}" method="post" class="ms-auto">
            <button class="btn btn-outline-light" type="submit">Выйти</button>
        </form>
    </div>
</nav>
<main class="container py-5">
    <h1>Личный кабинет</h1>
    <dl class="row">
        <dt class="col-sm-3">Имя пользователя</dt>
        <dd class="col-sm-9" th:text="${name}">…</dd>
        <dt class="col-sm-3">Email</dt>
        <dd class="col-sm-9" th:text="${email}">…</dd>
    </dl>
    <a class="btn btn-secondary" href="/">На главную</a>
</main>
</body>
</html>
