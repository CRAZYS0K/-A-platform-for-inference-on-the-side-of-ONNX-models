<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Уведомления')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: flash}"></div>

<main class="container py-4" style="max-width: 720px;">
    <h1>Уведомления</h1>
    <p class="text-muted">Платформа пришлёт письмо на адрес из профиля при завершении задачи.</p>

    <form method="post" th:action="@{/notifications}" class="card card-body">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div class="form-check form-switch mb-3">
            <input class="form-check-input" type="checkbox" id="emailEnabled" name="emailEnabled"
                   value="true" th:checked="${prefs.emailEnabled}"/>
            <label class="form-check-label" for="emailEnabled">Присылать email на адрес из профиля</label>
        </div>

        <button type="submit" class="btn btn-primary">Сохранить</button>
    </form>
</main>
</body>
</html>
