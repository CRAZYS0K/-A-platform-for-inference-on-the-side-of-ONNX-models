name: onnxi

# Production overlay for the 4 vCPU / 6 GB / 120 GB SSD VPS.
#
# Usage on the host:
#   cp docker/.env.prod.example docker/.env.prod
#   nano docker/.env.prod                                # fill secrets and DOMAIN
#   docker compose -f docker/docker-compose.prod.yml --env-file docker/.env.prod pull
#   docker compose -f docker/docker-compose.prod.yml --env-file docker/.env.prod up -d
#
# Images come from GitHub Container Registry; CI builds and pushes them on every push to main.

x-app-env: &app-env
  SPRING_PROFILES_ACTIVE: docker
  TZ: ${TZ:-UTC}

services:

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command: ["postgres", "-c", "shared_buffers=192MB", "-c", "max_connections=80"]
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 15s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512m
    networks: [onnxi-net]

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "96mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128m
    networks: [onnxi-net]

  kafka:
    image: apache/kafka:4.0.0
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
      CLUSTER_ID: "onnxi-cluster-id-onnxi-cluster-id"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 12
    deploy:
      resources:
        limits:
          memory: 768m
    networks: [onnxi-net]

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 256m
    networks: [onnxi-net]

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    restart: unless-stopped
    command: ["start", "--optimized", "--import-realm", "--http-port=8080"]
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_DB_SCHEMA: keycloak
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: "/auth"
      KC_HOSTNAME: https://${DOMAIN}/auth
      KC_HOSTNAME_STRICT: "false"
      KC_PROXY_HEADERS: "xforwarded"
      JAVA_OPTS_APPEND: "-Xms256m -Xmx768m"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      - keycloak-data:/opt/keycloak/data
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1g
    networks: [onnxi-net]

  prometheus:
    image: prom/prometheus:v3.2.1
    restart: unless-stopped
    volumes:
      - ../infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    deploy:
      resources:
        limits:
          memory: 320m
    networks: [onnxi-net]
    profiles: ["observability"]

  grafana:
    image: grafana/grafana:12.0.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: https://${DOMAIN}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - grafana-data:/var/lib/grafana
      - ../infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../infra/grafana/dashboards:/etc/grafana/dashboards:ro
    deploy:
      resources:
        limits:
          memory: 192m
    networks: [onnxi-net]
    profiles: ["observability"]

  # ─────────────── Application ───────────────

  gateway-service:
    image: ghcr.io/${GITHUB_REPO_OWNER:-crazys0k}/onnxi-gateway:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      <<: *app-env
      BACKEND_BASE_URL: http://backend-service:8081
      REDIS_HOST: redis
      KEYCLOAK_CLIENT_ID: onnxi-gateway
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      KEYCLOAK_AUTH_URI: https://${DOMAIN}/auth/realms/onnxi/protocol/openid-connect/auth
      KEYCLOAK_TOKEN_URI: http://keycloak:8080/auth/realms/onnxi/protocol/openid-connect/token
      KEYCLOAK_USERINFO_URI: http://keycloak:8080/auth/realms/onnxi/protocol/openid-connect/userinfo
      KEYCLOAK_JWKS_URI: http://keycloak:8080/auth/realms/onnxi/protocol/openid-connect/certs
      KEYCLOAK_END_SESSION_URI: https://${DOMAIN}/auth/realms/onnxi/protocol/openid-connect/logout
      COOKIE_SECURE: "true"
      JAVA_OPTS: "-Xms192m -Xmx384m -XX:MaxRAMPercentage=70"
    depends_on:
      redis:
        condition: service_healthy
      keycloak:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 512m
    networks: [onnxi-net]

  backend-service:
    image: ghcr.io/${GITHUB_REPO_OWNER:-crazys0k}/onnxi-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      <<: *app-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/auth/realms/onnxi
      KEYCLOAK_JWKS_URI: http://keycloak:8080/auth/realms/onnxi/protocol/openid-connect/certs
      JAVA_OPTS: "-Xms192m -Xmx384m -XX:MaxRAMPercentage=70"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
      keycloak:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 512m
    networks: [onnxi-net]

  inference-worker:
    image: ghcr.io/${GITHUB_REPO_OWNER:-crazys0k}/onnxi-worker:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      <<: *app-env
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      JAVA_OPTS: "-Xms256m -Xmx768m -XX:MaxRAMPercentage=70"
    depends_on:
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1300m
    networks: [onnxi-net]

  notification-service:
    image: ghcr.io/${GITHUB_REPO_OWNER:-crazys0k}/onnxi-notification:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      <<: *app-env
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_MAIL_HOST: ${SMTP_HOST:-localhost}
      SPRING_MAIL_PORT: ${SMTP_PORT:-25}
      SPRING_MAIL_USERNAME: ${SMTP_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SMTP_PASSWORD:-}
      SPRING_MAIL_AUTH: ${SMTP_AUTH:-false}
      SPRING_MAIL_STARTTLS: ${SMTP_STARTTLS:-false}
      NOTIFICATION_EMAIL_FROM: ${NOTIFICATION_EMAIL_FROM:-onnxi@localhost}
      JAVA_OPTS: "-Xms128m -Xmx256m -XX:MaxRAMPercentage=70"
    depends_on:
      kafka:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 320m
    networks: [onnxi-net]

  # ─────────────── Reverse proxy ───────────────

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./caddy/Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - gateway-service
      - keycloak
    deploy:
      resources:
        limits:
          memory: 96m
    networks: [onnxi-net]

networks:
  onnxi-net:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  kafka-data:
  minio-data:
  keycloak-data:
  prometheus-data:
  grafana-data:
  caddy-data:
  caddy-config:
