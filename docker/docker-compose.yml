name: onnxi

# Локальное окружение разработки. Поднимает всю инфраструктуру + наши сервисы
# через Caddy (HTTPS с самоподписанным сертификатом для https://localhost).
#
# Запуск:   docker compose -f docker/docker-compose.yml --env-file docker/.env up -d --build
# Логи:     docker compose -f docker/docker-compose.yml logs -f <service>
# Остановка: docker compose -f docker/docker-compose.yml down

services:
  # ─────────────── Инфраструктура ───────────────

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-onnxi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-onnxi}
      POSTGRES_DB: ${POSTGRES_DB:-onnxi}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [onnxi-net]

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [onnxi-net]

  kafka:
    image: apache/kafka:4.0.0
    restart: unless-stopped
    environment:
      # KRaft single-node
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      CLUSTER_ID: "onnxi-cluster-id-onnxi-cluster-id"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks: [onnxi-net]

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [onnxi-net]

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    restart: unless-stopped
    command: ["start-dev", "--import-realm", "--http-port=8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_HOSTNAME: https://localhost/auth
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_RELATIVE_PATH: "/auth"
      KC_PROXY_HEADERS: xforwarded
    volumes:
      # Монтируем каталог целиком, а не один файл: одиночные file-bind-mount'ы
      # рассыпаются после рестарта Docker Desktop на Windows/WSL2 (mount file→dir).
      # Keycloak с --import-realm импортирует все *.json из этого каталога.
      - ./keycloak:/opt/keycloak/data/import:ro
      - keycloak-data:/opt/keycloak/data
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\nhost: localhost\\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks: [onnxi-net]

  # Mailpit — SMTP-перехватчик для разработки (замена Mailhog).
  # Принимает письма на :1025 и показывает их в веб-интерфейсе на :8025.
  # С relay-конфигом + --smtp-relay-all дополнительно ПЕРЕСЫЛАЕТ письма на боевой
  # SMTP (Gmail/Яндекс) — тогда они реально доходят до адресата.
  # Каталог монтируем целиком (одиночный file-mount нестабилен на Windows/WSL2).
  # docker/mailpit/smtp-relay.yaml содержит секреты и в git НЕ коммитится
  # (шаблон — smtp-relay.yaml.example). Без него relay просто не активируется.
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    command: ["--smtp-relay-config=/conf/smtp-relay.yaml", "--smtp-relay-all"]
    volumes:
      - ./mailpit:/conf:ro
    ports:
      - "8025:8025"   # веб-интерфейс: http://localhost:8025
    networks: [onnxi-net]

  # ─────────────── Observability ───────────────

  prometheus:
    image: prom/prometheus:v3.2.1
    restart: unless-stopped
    volumes:
      - ../infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks: [onnxi-net]

  grafana:
    image: grafana/grafana:12.0.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana-data:/var/lib/grafana
      - ../infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../infra/grafana/dashboards:/etc/grafana/dashboards:ro
    networks: [onnxi-net]

  # ─────────────── Приложение ───────────────

  gateway-service:
    build:
      context: ..
      dockerfile: gateway-service/Dockerfile
    image: onnxi/gateway-service:dev
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      BACKEND_BASE_URL: http://backend-service:8081
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      KEYCLOAK_AUTH_URI: https://localhost/auth/realms/onnxi/protocol/openid-connect/auth
      KEYCLOAK_TOKEN_URI: http://keycloak:8080/auth/realms/onnxi/protocol/openid-connect/token
      KEYCLOAK_USERINFO_URI: http://keycloak:8080/auth/realms/onnxi/protocol/openid-connect/userinfo
      KEYCLOAK_JWKS_URI: http://keycloak:8080/auth/realms/onnxi/protocol/openid-connect/certs
      KEYCLOAK_END_SESSION_URI: https://localhost/auth/realms/onnxi/protocol/openid-connect/logout
    depends_on:
      redis:
        condition: service_healthy
      keycloak:
        condition: service_started
    networks: [onnxi-net]

  backend-service:
    build:
      context: ..
      dockerfile: backend-service/Dockerfile
    image: onnxi/backend-service:dev
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-onnxi}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-onnxi}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-onnxi}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/auth/realms/onnxi
      KEYCLOAK_JWKS_URI: http://keycloak:8080/auth/realms/onnxi/protocol/openid-connect/certs
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
      keycloak:
        condition: service_started
    networks: [onnxi-net]

  inference-worker:
    build:
      context: ..
      dockerfile: inference-worker/Dockerfile
    image: onnxi/inference-worker:dev
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    depends_on:
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks: [onnxi-net]

  notification-service:
    build:
      context: ..
      dockerfile: notification-service/Dockerfile
    image: onnxi/notification-service:dev
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: "1025"
    depends_on:
      kafka:
        condition: service_healthy
      mailpit:
        condition: service_started
    networks: [onnxi-net]

  # ─────────────── Reverse proxy ───────────────

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - gateway-service
      - keycloak
    networks: [onnxi-net]

networks:
  onnxi-net:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  kafka-data:
  minio-data:
  keycloak-data:
  prometheus-data:
  grafana-data:
  caddy-data:
  caddy-config:
