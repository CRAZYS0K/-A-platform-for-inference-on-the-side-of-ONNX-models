spring:
  application:
    name: backend-service

  servlet:
    multipart:
      enabled: true
      max-file-size: 500MB
      max-request-size: 600MB
      file-size-threshold: 10MB

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/onnxi}
    username: ${SPRING_DATASOURCE_USERNAME:onnxi}
    password: ${SPRING_DATASOURCE_PASSWORD:onnxi}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml

  security:
    oauth2:
      resourceserver:
        jwt:
          # Validate signature via JWKS only. Issuer matching is intentionally
          # omitted because the public-facing issuer (https://localhost/auth/...)
          # is not reachable from inside the docker network without TLS hacks.
          jwk-set-uri: ${KEYCLOAK_JWKS_URI:http://localhost/auth/realms/onnxi/protocol/openid-connect/certs}

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        spring.json.add.type.headers: false
    consumer:
      group-id: onnxi-backend
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.value.default.type: com.sokolov.labs.shared.dto.InferenceStatusMessage
        spring.json.trusted.packages: com.sokolov.labs.shared.dto
        spring.json.use.type.headers: false

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET:onnxi}
  presigned-ttl-seconds: 600

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  level:
    root: INFO
    com.sokolov.labs: DEBUG
